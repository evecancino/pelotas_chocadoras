<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Carrito – Pelotas Chocadoras Santiago</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    .carrito-section {
      min-height: 100vh;
      padding: 8rem 6vw 4rem;
      background: var(--fondo);
    }
    .carrito-header { margin-bottom: 2.5rem; }
    .carrito-header h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 4vw, 3rem);
      color: var(--carbon);
    }
    .carrito-header h1 em { font-style: normal; color: var(--naranja); }
    .carrito-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 2rem;
      align-items: start;
    }
    .carrito-items { display: flex; flex-direction: column; gap: 1rem; }
    .carrito-item {
      background: white;
      border-radius: var(--radius-xl);
      padding: 1.2rem;
      display: flex;
      align-items: center;
      gap: 1.2rem;
      box-shadow: var(--sombra);
      border: 3px solid transparent;
      transition: border-color 0.2s;
    }
    .carrito-item:hover { border-color: var(--amarillo); }
    .carrito-item-emoji {
      width: 80px; height: 80px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem; flex-shrink: 0;
    }
    .carrito-item-info { flex: 1; }
    .carrito-item-info h3 {
      font-family: var(--font-display);
      font-size: 1.15rem;
      margin-bottom: 0.2rem;
    }
    .carrito-item-info p { font-size: 0.85rem; color: var(--gris); }
    .carrito-item-fecha {
      font-size: 0.82rem;
      color: var(--naranja);
      font-weight: 700;
      margin-top: 0.3rem;
    }
    .carrito-item-precio {
      font-family: var(--font-display);
      font-size: 1.3rem;
      color: var(--carbon);
      min-width: 100px;
      text-align: right;
    }
    .btn-eliminar {
      background: none; border: none;
      font-size: 1.2rem; cursor: pointer;
      padding: 0.3rem; transition: transform 0.2s;
    }
    .btn-eliminar:hover { transform: scale(1.3); }
    .carrito-resumen {
      background: white;
      border-radius: var(--radius-xl);
      padding: 1.8rem;
      box-shadow: var(--sombra);
      position: sticky; top: 90px;
      border: 3px solid var(--amarillo);
    }
    .carrito-resumen h2 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 3px solid var(--amarillo);
    }
    .resumen-linea {
      display: flex; justify-content: space-between;
      margin-bottom: 0.8rem; font-size: 0.9rem; color: var(--gris);
      font-weight: 600;
    }
    .resumen-total {
      display: flex; justify-content: space-between;
      margin-top: 1.2rem; padding-top: 1.2rem;
      border-top: 3px solid var(--amarillo);
      font-family: var(--font-display);
      font-size: 1.5rem;
    }
    .carrito-resumen .btn-primary {
      width: 100%; text-align: center;
      margin-top: 1.5rem; padding: 1rem;
      display: block;
    }
    .btn-vaciar {
      width: 100%; margin-top: 0.8rem; padding: 0.7rem;
      background: transparent;
      border: 2px solid var(--gris);
      border-radius: 50px;
      font-family: var(--font-body);
      font-size: 0.85rem; color: var(--gris);
      font-weight: 700;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-vaciar:hover { border-color: var(--rojo); color: var(--rojo); }
    .carrito-vacio {
      text-align: center; padding: 5rem 2rem; color: var(--gris);
    }
    .carrito-vacio span { font-size: 5rem; display: block; margin-bottom: 1rem; }
    .carrito-vacio h2 {
      font-family: var(--font-display);
      font-size: 2rem; margin-bottom: 1rem; color: var(--carbon);
    }
    @media (max-width: 768px) {
      .carrito-layout { grid-template-columns: 1fr; }
      .carrito-resumen { position: static; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-logo"><a href="../index.html" style="text-decoration:none;color:inherit;">🎯 Pelotas Chocadoras <span>Santiago</span></a></div>
    <ul class="nav-links">
      <li><a href="../index.html">Inicio</a></li>
      <li><a href="../index.html#servicios">Servicios</a></li>
      <li><a href="../index.html#contacto">Contacto</a></li>
    </ul>
    <div class="nav-cart" onclick="window.location.href='carrito.html'" style="cursor:pointer;">
      <span class="cart-icon">🛒</span>
      <span class="cart-count">0</span>
    </div>
  </nav>

  <section class="carrito-section">
    <div class="carrito-header">
      <p class="section-tag">🛒 Mi reserva</p>
      <h1>Carrito de <em>reservas</em></h1>
    </div>

    <div id="carrito-vacio" class="carrito-vacio" style="display:none;">
      <span>🛒</span>
      <h2>Tu carrito está vacío</h2>
      <p>Agrega servicios desde el catálogo para comenzar.</p>
      <a href="../index.html" class="btn-primary" style="margin-top:1.5rem; display:inline-block;">Ver servicios 🎉</a>
    </div>

    <div class="carrito-layout" id="carrito-layout">
      <div class="carrito-items" id="carrito-items"></div>
      <div class="carrito-resumen">
        <h2>🎉 Resumen</h2>
        <div class="resumen-linea">
          <span>Subtotal</span>
          <span id="subtotal">$0</span>
        </div>
        <div class="resumen-linea">
          <span>Traslado</span>
          <span>A coordinar</span>
        </div>
        <div class="resumen-total">
          <span>Total</span>
          <span id="total">$0</span>
        </div>
        <button class="btn-primary" onclick="irAPagar()">Pagar con Transbank 💳</button>
        <button class="btn-vaciar" onclick="vaciarCarrito()">Vaciar carrito</button>
      </div>
    </div>
  </section>

  <script>
    function cargarCarrito() {
      const carritoLocal = JSON.parse(localStorage.getItem('carritoChocadoras') || '[]');
      const layout = document.getElementById('carrito-layout');
      const vacio = document.getElementById('carrito-vacio');

      if (carritoLocal.length === 0) {
        layout.style.display = 'none';
        vacio.style.display = 'block';
        return;
      }

      layout.style.display = 'grid';
      vacio.style.display = 'none';

      const container = document.getElementById('carrito-items');
      container.innerHTML = carritoLocal.map((item, idx) => `
        <div class="carrito-item">
          <div class="carrito-item-emoji" style="background:${item.fondo}">
            ${item.emoji}
          </div>
          <div class="carrito-item-info">
            <h3>${item.nombre}</h3>
            <p>$${Number(item.precio).toLocaleString('es-CL')} / hora</p>
            <p class="carrito-item-fecha">📅 ${formatearFecha(item.fecha)} a las ${item.hora} hrs</p>
          </div>
          <div class="carrito-item-precio">
            $${Number(item.precio).toLocaleString('es-CL')}
          </div>
          <button class="btn-eliminar" onclick="eliminarItem(${idx})">🗑️</button>
        </div>
      `).join('');

      const total = carritoLocal.reduce((s, i) => s + Number(i.precio), 0);
      document.getElementById('subtotal').textContent = `$${total.toLocaleString('es-CL')}`;
      document.getElementById('total').textContent = `$${total.toLocaleString('es-CL')}`;
      document.querySelector('.cart-count').textContent = carritoLocal.length;
    }

    function formatearFecha(fechaStr) {
      if (!fechaStr) return '';
      const [y, m, d] = fechaStr.split('-');
      return `${d}/${m}/${y}`;
    }

    function eliminarItem(idx) {
      let carritoLocal = JSON.parse(localStorage.getItem('carritoChocadoras') || '[]');
      carritoLocal.splice(idx, 1);
      localStorage.setItem('carritoChocadoras', JSON.stringify(carritoLocal));
      cargarCarrito();
    }

    function vaciarCarrito() {
      localStorage.removeItem('carritoChocadoras');
      cargarCarrito();
    }

    function irAPagar() {
      alert('🚧 Integración con Transbank próximamente. Por ahora contáctanos por WhatsApp para confirmar tu reserva.');
    }

    cargarCarrito();
  </script>
</body>
</html>
