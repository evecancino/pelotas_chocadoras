<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Detalle – Pelotas Chocadoras Santiago</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    .detalle-section {
      height: 100vh;
      padding: 5rem 4vw 1rem;
      background: var(--fondo);
      display: flex;
      align-items: center;
    }
    .detalle-card {
      width: 100%;
      max-width: 1200px; 
      margin: 0 auto;
      background: white;
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--sombra);
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .detalle-img {
      min-height: 490px;
      max-height: 520px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 6rem;
      position: relative;
    }
    .detalle-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--rojo);
      color: white;
      font-weight: 800;
      font-size: 0.9rem;
      padding: 0.5rem 1rem;
      border-radius: 50px;
    }
    .detalle-body {
      padding: 1.2rem;
      overflow-y: auto;
    }
    @media (max-width: 768px) {
      .detalle-card {
        grid-template-columns: 1fr;
      }
      .detalle-img { min-height: 250px; font-size: 7rem; }
    }
    .detalle-categoria {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--naranja);
      margin-bottom: 0.2rem;
    }
    .detalle-body h1 {
      font-family: var(--font-display);
      font-size: clamp(1.2rem, 2.5vw, 1.7rem);
      color: var(--carbon);
      margin-bottom: 0.5rem;
    }
    .detalle-descripcion {
      font-size: 0.82rem;
      color: #444;
      line-height: 1.5;
      margin-bottom: 0.6rem;
    }
    .detalle-precio-wrap {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 0.8rem;
      padding: 0.8rem;
      background: var(--fondo);
      border-radius: var(--radius);
    }
    .detalle-precio {
      font-family: var(--font-display);
      font-size: 1.8rem;
      color: var(--carbon);
    }
    .detalle-precio span {
      font-size: 1rem;
      color: var(--gris);
      font-family: var(--font-body);
      font-weight: 600;
    }

    /* RESERVA */
    .reserva-box {
      background: var(--fondo);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 0.8rem;
      border: 3px solid var(--amarillo);
    }
    .reserva-box h3 {
      font-family: var(--font-display);
      font-size: 1.2rem;
      margin-bottom: 0.8rem;
      color: var(--carbon);
    }
    .reserva-campos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }
    .campo-grupo {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .campo-grupo label {
      font-weight: 700;
      font-size: 0.78rem;
      color: var(--carbon);
    }
    .campo-grupo input, .campo-grupo select {
      padding: 0.5rem 0.8rem;
      border: 2px solid var(--amarillo);
      border-radius: 10px;
      font-family: var(--font-body);
      font-size: 0.95rem;
      color: var(--carbon);
      background: white;
      outline: none;
      transition: border-color 0.2s;
    }
    .campo-grupo input:focus, .campo-grupo select:focus {
      border-color: var(--naranja);
    }

    .detalle-acciones {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .btn-agregar {
      background: var(--amarillo);
      color: var(--carbon);
      border: none;
      padding: 0.65rem 1.3rem;
      border-radius: 50px;
      font-family: var(--font-body);
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 6px 0 #c9a800;
      transition: all 0.15s;
    }
    .btn-agregar:hover {
      transform: translateY(-3px);
      box-shadow: 0 9px 0 #c9a800;
    }
    .btn-agregar:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #c9a800;
    }
    .btn-volver {
      background: transparent;
      border: 2px solid var(--gris);
      color: var(--gris);
      padding: 0.65rem 1.3rem;
      border-radius: 50px;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    .btn-volver:hover { border-color: var(--carbon); color: var(--carbon); }

    /* MODAL CONFIRMACIÓN */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 999;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-box {
      background: white;
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: popIn 0.3s ease;
    }
    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-emoji { font-size: 4rem; margin-bottom: 1rem; }
    .modal-box h3 {
      font-family: var(--font-display);
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
    }
    .modal-box p { color: var(--gris); margin-bottom: 1.5rem; }
    .modal-acciones { display: flex; gap: 1rem; justify-content: center; }

    @media (max-width: 600px) {
      .reserva-campos { grid-template-columns: 1fr; }
      .detalle-acciones { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-logo"><a href="../index.html" style="text-decoration:none;color:inherit;">🎯 Pelotas Chocadoras <span>Santiago</span></a></div>
    <ul class="nav-links">
      <li><a href="../index.html">Inicio</a></li>
      <li><a href="../index.html#servicios">Servicios</a></li>
      <li><a href="../index.html#contacto">Contacto</a></li>
    </ul>
    <div class="nav-cart" onclick="window.location.href='carrito.html'" style="cursor:pointer;">
      <span class="cart-icon">🛒</span>
      <span class="cart-count">0</span>
    </div>
  </nav>

  <section class="detalle-section">
    <div class="detalle-card" id="detalle-card">
      <!-- Se carga dinámicamente -->
    </div>
  </section>

  <script>
    const servicios = [
      { id: 1, nombre: 'Pelota Chocadora Individual', descripcion: 'Diversión asegurada para 1 persona. Ideal para cumpleaños y eventos familiares.', precio: 8990, categoria: 'pelotas-chocadoras', emoji: '💥', fondo: 'linear-gradient(135deg, #FF6B00, #FFD600)', popular: true, detalle: 'La clásica pelota chocadora inflable para 1 persona. Perfecta para niños desde 6 años. Incluye casco protector y peto acolchado. Tiempo de uso: 15 minutos por turno. Ideal para fiestas de cumpleaños, eventos escolares y celebraciones familiares.' },
      { id: 2, nombre: 'Pack 2 Pelotas Chocadoras', descripcion: '¡El duelo más divertido! 2 pelotas para enfrentarse cara a cara.', precio: 15990, categoria: 'pelotas-chocadoras', emoji: '⚡', fondo: 'linear-gradient(135deg, #FF2D55, #FF6B00)', popular: false, detalle: 'El pack perfecto para un duelo épico. Incluye 2 pelotas chocadoras, 2 cascos y 2 petos protectores. Los participantes se chocan entre sí en una pista delimitada. Apto para niños y adultos. Diversión garantizada para todos los asistentes.' },
      { id: 3, nombre: 'Pack 4 Pelotas Chocadoras', descripcion: 'El pack más popular para grupos. ¡4 jugadores al mismo tiempo!', precio: 28990, categoria: 'paquetes', emoji: '🎯', fondo: 'linear-gradient(135deg, #007AFF, #AF52DE)', popular: true, detalle: 'El paquete más solicitado para eventos. 4 pelotas chocadoras con todo el equipamiento necesario. Perfecto para torneos entre amigos o familia. Incluye 4 cascos, 4 petos y una pista delimitada de 6x6 metros. Tiempo mínimo de arriendo: 1 hora.' },
      { id: 4, nombre: 'Zorb Ball Individual', descripcion: 'Métete dentro de una bola gigante y rueda por todos lados. ¡Increíble!', precio: 12990, categoria: 'zorb-ball', emoji: '🌀', fondo: 'linear-gradient(135deg, #34C759, #007AFF)', popular: false, detalle: 'La Zorb Ball es una bola inflable gigante en la que te metes y ruedas por una superficie. Una experiencia única e inolvidable. Apto para personas de 20 a 100 kg. El participante va asegurado dentro de la bola. Superficie recomendada: pasto o superficie plana.' },
      { id: 5, nombre: 'Pack Zorb Ball x2', descripcion: '2 Zorb Balls para competir en carreras o chocarse entre sí.', precio: 22990, categoria: 'zorb-ball', emoji: '🔵', fondo: 'linear-gradient(135deg, #5856D6, #34C759)', popular: false, detalle: '¡Doble la diversión con 2 Zorb Balls! Perfectas para carreras, empujones y competencias. Cada bola tiene espacio para 1 persona. Incluye superficie de rodado de 10 metros. Los participantes quedan completamente protegidos dentro de la bola.' },
      { id: 6, nombre: 'Pista de Sumo Inflable', descripcion: 'Trajes de sumo gigantes para combates épicos entre amigos.', precio: 19990, categoria: 'juegos', emoji: '🥊', fondo: 'linear-gradient(135deg, #FFD600, #FF6B00)', popular: true, detalle: 'Los famosos trajes de sumo inflables para combates llenos de risas. Incluye 2 trajes de sumo gigantes, pista delimitada y juez de combate (opcional). Apto para mayores de 10 años. Los participantes se empujan hasta que uno cae. ¡El juego más gracioso de la fiesta!' },
      { id: 7, nombre: 'Cama Elástica Profesional', descripcion: 'Cama elástica de 4 metros con red de seguridad. ¡Salta hasta el cielo!', precio: 35000, categoria: 'juegos', emoji: '🤸', fondo: 'linear-gradient(135deg, #FF375F, #AF52DE)', popular: false, detalle: 'Cama elástica profesional de 4 metros de diámetro con red de seguridad de 2 metros de altura. Capacidad para 3 niños simultáneamente. Apto para niños hasta 12 años y 60 kg. Incluye colchoneta alrededor para mayor seguridad. Requiere espacio mínimo de 6x6 metros.' },
      { id: 8, nombre: 'Tobogán Inflable Gigante', descripcion: 'Tobogán inflable de 5 metros de altura. ¡La atracción estrella de tu evento!', precio: 45000, categoria: 'juegos', emoji: '🎢', fondo: 'linear-gradient(135deg, #007AFF, #34C759)', popular: false, detalle: 'Tobogán inflable de 5 metros de alto y 8 metros de largo. La atracción principal para cualquier evento. Capacidad para uso continuo con turnos de 1 persona. Apto para niños de 4 a 14 años. Requiere un área de 12x6 metros y toma eléctrica para la motoinfla.' },
      { id: 9, nombre: 'Pack Fiesta Completa', descripcion: '4 pelotas chocadoras + 1 zorb ball + sumo. ¡El paquete definitivo!', precio: 65000, categoria: 'paquetes', emoji: '🎊', fondo: 'linear-gradient(135deg, #FF6B00, #FF2D55)', popular: true, detalle: 'El paquete más completo para una fiesta épica. Incluye: 4 pelotas chocadoras con equipamiento, 1 zorb ball, 2 trajes de sumo y 1 operador para todo el evento. Duración mínima: 3 horas. Perfecto para cumpleaños, eventos corporativos y celebraciones grandes. Incluye traslado dentro de Santiago.' },
      { id: 10, nombre: 'Carrera de Sacos Gigante', descripcion: 'Sacos gigantes inflables para carreras grupales. ¡Risas garantizadas!', precio: 14990, categoria: 'juegos', emoji: '🏃', fondo: 'linear-gradient(135deg, #34C759, #FFD600)', popular: false, detalle: 'Set de 6 sacos inflables gigantes para carreras en grupos. Cada saco tiene espacio para 1 persona que debe saltar dentro. Perfecto para competencias grupales en fiestas y eventos. Apto para niños y adultos. Incluye pista delimitada de 20 metros. ¡El juego más divertido para todas las edades!' }
    ];

    const id = parseInt(localStorage.getItem('servicioDetalle'));
    const servicio = servicios.find(s => s.id === id);

    if (!servicio) {
      window.location.href = '../index.html';
    } else {
      // Horas disponibles
      const horas = ['09:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00', '20:00'];

      document.getElementById('detalle-card').innerHTML = `
        <div class="detalle-img" style="background:${servicio.fondo}">
          <span style="filter:drop-shadow(0 8px 16px rgba(0,0,0,0.3))">${servicio.emoji}</span>
          ${servicio.popular ? '<div class="detalle-badge">⭐ Popular</div>' : ''}
        </div>
        <div class="detalle-body">
          <p class="detalle-categoria">${servicio.categoria.replace(/-/g, ' ')}</p>
          <h1>${servicio.nombre}</h1>
          <p class="detalle-descripcion">${servicio.detalle}</p>

          <div class="detalle-precio-wrap">
            <div class="detalle-precio">
              $${servicio.precio.toLocaleString('es-CL')}
              <span>/ por hora</span>
            </div>
          </div>

          <div class="reserva-box">
            <h3>📅 Elige tu fecha y hora</h3>
            <div class="reserva-campos">
              <div class="campo-grupo">
                <label>📆 Fecha del evento</label>
                <input type="date" id="fecha-reserva" min="${new Date().toISOString().split('T')[0]}" />
              </div>
              <div class="campo-grupo">
                <label>🕐 Hora de inicio</label>
                <select id="hora-reserva">
                  <option value="">Selecciona una hora</option>
                  ${horas.map(h => `<option value="${h}">${h} hrs</option>`).join('')}
                </select>
              </div>
            </div>
          </div>

          <div class="detalle-acciones">
            <button class="btn-agregar" onclick="agregarAlCarrito()">🛒 Agregar al carrito</button>
            <a href="../index.html" class="btn-volver">← Volver</a>
          </div>
        </div>
      `;

      actualizarContador();
    }

    function agregarAlCarrito() {
      const fecha = document.getElementById('fecha-reserva').value;
      const hora = document.getElementById('hora-reserva').value;

      if (!fecha) {
        mostrarAlerta('📅 Elige una fecha para tu reserva');
        return;
      }
      if (!hora) {
        mostrarAlerta('🕐 Elige una hora para tu reserva');
        return;
      }

      let carritoLocal = JSON.parse(localStorage.getItem('carritoChocadoras') || '[]');

      carritoLocal.push({
        id: servicio.id,
        nombre: servicio.nombre,
        precio: servicio.precio,
        emoji: servicio.emoji,
        fondo: servicio.fondo,
        fecha: fecha,
        hora: hora,
        cantidad: 1
      });

      localStorage.setItem('carritoChocadoras', JSON.stringify(carritoLocal));
      actualizarContador();
      mostrarExito();
    }

    function mostrarAlerta(msg) {
      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.innerHTML = `
        <div class="modal-box">
          <div class="modal-emoji">⚠️</div>
          <h3>${msg}</h3>
          <div class="modal-acciones">
            <button class="btn-primary" onclick="this.closest('.modal-overlay').remove()">Entendido</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    function mostrarExito() {
      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.innerHTML = `
        <div class="modal-box">
          <div class="modal-emoji">🎉</div>
          <h3>¡Agregado al carrito!</h3>
          <p>Tu reserva fue agregada. ¿Qué quieres hacer ahora?</p>
          <div class="modal-acciones">
            <button class="btn-agregar" onclick="window.location.href='carrito.html'">Ver carrito 🛒</button>
            <button class="btn-volver" onclick="window.location.href='../index.html'">Seguir viendo</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    function actualizarContador() {
      const carritoLocal = JSON.parse(localStorage.getItem('carritoChocadoras') || '[]');
      const total = carritoLocal.reduce((s, i) => s + i.cantidad, 0);
      const contador = document.querySelector('.cart-count');
      if (contador) contador.textContent = total;
    }
  </script>
</body>
</html>
